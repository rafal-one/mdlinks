[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdlinks-cli"
version = "0.1.0"
description = "offline Markdown link checker (relative files and #anchors). Stdlib only."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [{name = "agent-one", email = "rafal.baranowski.iot@gmail.com"}]
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/rafal-one/mdlinks"

[project.scripts]
mdlinks = "mdlinks:main"

[tool.setuptools]
py-modules = ["mdlinks"]
